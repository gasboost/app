name: Publish

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  check-versions:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      publish-app: ${{ steps.versions.outputs.publish-app }}
      publish-vite: ${{ steps.versions.outputs.publish-vite }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check package versions
        id: versions
        run: |
          check_package() {
            local output="$1"
            local manifest="$2"
            local name
            local version

            name=$(node -p "require('./${manifest}').name")
            version=$(node -p "require('./${manifest}').version")

            echo "${name}@${version}"

            if npm view "${name}@${version}" version > /dev/null 2>&1; then
              echo "${output}=false" >> "$GITHUB_OUTPUT"
            else
              echo "${output}=true" >> "$GITHUB_OUTPUT"
            fi
          }

          check_package publish-app packages/app/package.json
          check_package publish-vite packages/vite/package.json

  publish:
    needs: check-versions
    if: ${{ needs.check-versions.outputs.publish-app == 'true' || needs.check-versions.outputs.publish-vite == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck app
        if: ${{ needs.check-versions.outputs.publish-app == 'true' }}
        run: pnpm --filter @gasboost/app typecheck

      - name: Test app
        if: ${{ needs.check-versions.outputs.publish-app == 'true' }}
        run: pnpm --filter @gasboost/app test

      - name: Build app
        if: ${{ needs.check-versions.outputs.publish-app == 'true' }}
        run: pnpm --filter @gasboost/app build

      - name: Typecheck vite
        if: ${{ needs.check-versions.outputs.publish-vite == 'true' }}
        run: pnpm --filter @gasboost/vite typecheck

      - name: Test vite
        if: ${{ needs.check-versions.outputs.publish-vite == 'true' }}
        run: pnpm --filter @gasboost/vite test

      - name: Build vite
        if: ${{ needs.check-versions.outputs.publish-vite == 'true' }}
        run: pnpm --filter @gasboost/vite build

      - name: Verify app package contents
        if: ${{ needs.check-versions.outputs.publish-app == 'true' }}
        working-directory: packages/app
        run: pnpm pack

      - name: Publish app
        if: ${{ needs.check-versions.outputs.publish-app == 'true' }}
        working-directory: packages/app
        run: pnpm publish --access public --no-git-checks

      - name: Verify vite package contents
        if: ${{ needs.check-versions.outputs.publish-vite == 'true' }}
        working-directory: packages/vite
        run: pnpm pack

      - name: Publish vite
        if: ${{ needs.check-versions.outputs.publish-vite == 'true' }}
        working-directory: packages/vite
        run: pnpm publish --access public --no-git-checks
